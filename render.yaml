services:
  - type: web
    name: vovinam-thanh-xuan-celebration-cards
    runtime: node
    plan: free
    branch: main
    # Set autoDeploy: false if you prefer strictly CI-gated deploys via GitHub Secret RENDER_DEPLOY_HOOK_URL
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HEARTBEAT_ENABLED
        value: "true"
      - key: HEARTBEAT_INTERVAL_MS
        value: "300000"
      - key: MONGODB_URI
        sync: false
